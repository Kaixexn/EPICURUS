<div class="admin-controls" style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-bottom: 1rem;">
  <button id="adminLoginBtn" class="filter-btn">Admin Login</button>
  <button id="adminLogoutBtn" class="filter-btn" style="display: none;">Logout</button>
</div>
  </div>
</nav>

<main class="wall-main">
  <section class="create-post">
    <div class="section-header">
      <h1 class="section-title">Freedom Wall</h1>
      <p class="section-subtitle">Share your thoughts, memories, or anything you desire</p>
    </div>

    <form class="post-form" id="postForm">
      <div class="form-row">
        <div class="profile-preview" id="profilePreview">
          <div class="default-avatar">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="4" stroke="#d4a843" stroke-width="1.5"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="#d4a843" stroke-width="1.5"/>
            </svg>
          </div>
        </div>
        <div class="form-fields">
          <input type="text" id="authorName" name="authorName" placeholder="Your name (or leave empty for anonymous)" class="form-input">
        </div>
      </div>

      <textarea id="postContent" name="postContent" placeholder="What's on your mind?" class="form-textarea" rows="4" required></textarea>
<div class="music-search-section">
  <label class="music-search-label">
    <svg viewBox="0 0 24 24" fill="none"><path d="M9 18V5l12-2v12" stroke="#d4a843" stroke-width="2"/><circle cx="6" cy="18" r="3" stroke="#d4a843" stroke-width="2"/><circle cx="18" cy="16" r="3" stroke="#d4a843" stroke-width="2"/></svg>
    <span>🎵 Add Music (optional)</span>
  </label>
  <input type="text" id="musicSearchInput" class="music-search-input" placeholder="Search for a song..." autocomplete="off">
  <div class="music-results" id="musicResults"></div>
  <div class="music-selected" id="musicSelected">
    <img class="selected-art" id="selectedArt" src="" alt="">
    <div class="selected-info">
      <div class="selected-title" id="selectedTitle"></div>
      <div class="selected-artist" id="selectedArtist"></div>
      <button type="button" class="remove-music-btn" id="removeMusicBtn">✕ Remove</button>
    </div>
  </div>
</div>
      <button type="submit" class="submit-btn" id="submitBtn">
        <span>Post to Wall</span>
      </button>
    </form>
  </section>

  <section class="posts-section">
    <div class="posts-header">
      <h2>Recent Posts</h2>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="anonymous">Anonymous</button>
        <button class="filter-btn" data-filter="named">Named</button>
      </div>
    </div>

    <div class="posts-container" id="postsContainer">
      <div class="loading">Loading posts...</div>
    </div>
  </section>
</main>

<script src="freedom-wall.js"></script>
</body>
</html>
