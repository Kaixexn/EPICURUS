        <line x1="23" y1="10" x2="23" y2="26" stroke="#d4a843" stroke-width="1.2"/>
        <line x1="7" y1="26" x2="25" y2="26" stroke="#d4a843" stroke-width="1.8"/>
        <line x1="7" y1="6" x2="25" y2="6" stroke="#d4a843" stroke-width="1.8"/>

      Epicurus

    <ul class="nav-links" role="list">

<main class="wall-main">
  <section class="create-post">
    <div class="section-header">
      <h1 class="section-title">Freedom Wall</h1>
      <p class="section-subtitle">Share your thoughts, memories, or anything you desire</p>
    </div>

    <form class="post-form" id="postForm">
      <div class="form-row">
        <div class="profile-preview" id="profilePreview">
          <div class="default-avatar">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="8" r="4" stroke="#d4a843" stroke-width="1.5"/>
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="#d4a843" stroke-width="1.5"/>
            </svg>
          </div>
        </div>
        <div class="form-fields">
          <input type="text" id="authorName" name="authorName" placeholder="Your name (or leave empty for anonymous)" class="form-input">
        </div>
      </div>

      <textarea id="postContent" name="postContent" placeholder="What's on your mind?" class="form-textarea" rows="4" required></textarea>

      <div class="image-upload-section">
        <label for="postImage" class="image-upload-label">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="16" rx="2" stroke="#d4a843" stroke-width="1.5"/>
            <circle cx="8.5" cy="9.5" r="1.5" stroke="#d4a843" stroke-width="1.5"/>
            <path d="M7 15l3-3 2.5 2.5 3-3 4 4" stroke="#d4a843" stroke-width="1.5"/>
          </svg>
          <span>Add an image (optional)</span>
        </label>
        <input type="file" id="postImage" name="postImage" accept="image/*" class="image-input">
        <div class="image-preview-container" id="imagePreviewContainer">
          <img id="imagePreview" src="" alt="Preview">
          <button type="button" class="remove-image" id="removeImage">Remove</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span>Post to Wall</span>
      </button>
    </form>
  </section>

  <section class="posts-section">
    <div class="posts-header">
      <h2>Recent Posts</h2>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="anonymous">Anonymous</button>
        <button class="filter-btn" data-filter="named">Named</button>
      </div>
    </div>

    <div class="posts-container" id="postsContainer">
    </div>
  </section>
</main>

<script src="script.js"></script>
<script src="freedom-wall.js"></script>
</body>
</html>
